apis:
- aid: anvilogic:mcp
  name: Anvilogic MCP Server
  description: 'The Anvilogic MCP Server is the platform''s Model Context Protocol
    surface, letting AI agents and MCP clients call Anvilogic platform tools against
    a customer''s security graph, detections, searches, and cases. It is an OAuth
    2.1 protected resource: an unauthenticated tools/list returns HTTP 401 with a
    WWW-Authenticate Bearer challenge advertising the RFC 9728 protected-resource
    metadata document. Tool calls are metered at 1 AI credit per call and governed
    by a per-product daily budget.'
  humanURL: https://public-docs.anvilogic.com/get-started/ai-operating-system-pricing
  baseURL: https://secure.anvilogic.com/mcp
  tags:
  - MCP
  - Agents
  - Security Operations
  tags_raw:
  - Model Context Protocol
  - Agents
  - Security Operations
