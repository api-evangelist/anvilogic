aid: anvilogic
name: Anvilogic
description: 'Anvilogic is an Agentic SecOps platform founded in 2019 by former SOC
  practitioners. It runs AI automation across the security operations lifecycle —
  onboarding, federated search, detection engineering, and triage & investigation —
  on top of the SIEMs, data lakes, and storage services a security team already
  operates, without requiring data migration. An AI Operating System coordinates
  task-scoped agents over an enterprise security graph, and Blueprints chains those
  agents into repeatable, human-approved workflows. The platform integrates with
  Splunk, Snowflake, Databricks, Microsoft Sentinel, Elastic, CrowdStrike, Amazon
  S3, and dozens of EDR, SOAR, and workflow tools. Anvilogic exposes an OAuth 2.1
  protected Model Context Protocol (MCP) server so agents and customer-configured
  MCP connectors can call platform tools directly.'
