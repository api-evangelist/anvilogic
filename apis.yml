- aid: anvilogic:authorization
  name: Anvilogic Platform Authorization API
  description: 'The OAuth 2.1 authorization surface for the Anvilogic platform,
    advertised at the RFC 8414 /.well-known/oauth-authorization-server document on
    secure.anvilogic.com. It supports the authorization_code grant with PKCE (S256)
    and refresh_token, uses public clients (token_endpoint_auth_methods_supported =
    none), and exposes token and introspection endpoints. It is the authorization
    server backing the Anvilogic MCP Server protected resource.'
  humanURL: https://public-docs.anvilogic.com/get-started/onboarding-guide/additional-tasks
  baseURL: https://secure.anvilogic.com/api/authentication/oauth
